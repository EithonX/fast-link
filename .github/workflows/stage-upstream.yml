name: Stage vetted upstream baseline
on:
  push:
    branches:
      - migration/mediapeek-modern-stack
permissions:
  contents: write
jobs:
  sync:
    if: github.event.head_commit.message == 'ci: retry pinned MediaPeek upstream staging without workflow write permission'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out FastLink migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/mediapeek-modern-stack
          persist-credentials: true
      - name: Clone pinned MediaPeek upstream revision
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --no-tags https://github.com/DG02002/mediapeek.git "$RUNNER_TEMP/mediapeek-upstream"
          actual="$(git -C "$RUNNER_TEMP/mediapeek-upstream" rev-parse HEAD)"
          expected="621a315e79298d14223782b4d9dd1f8c9803034d"
          test "$actual" = "$expected" || { echo "::error::Upstream changed; review the new revision"; exit 1; }
      - name: Stage upstream source, preserving GitHub workflow files
        run: |
          set -euo pipefail
          git ls-files -z | while IFS= read -r -d '' path; do
            case "$path" in
              .github/*) ;;
              *) git rm --quiet -- "$path" ;;
            esac
          done
          rsync -a --exclude .git --exclude .github "$RUNNER_TEMP/mediapeek-upstream/" ./
          git add -A -- . ':!.github'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: stage MediaPeek 621a315 source for FastLink migration"
          git push origin HEAD:migration/mediapeek-modern-stack
