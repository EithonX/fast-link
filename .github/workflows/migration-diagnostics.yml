name: Diagnose FastLink migration
on:
  push:
    branches:
      - migration/mediapeek-modern-stack
permissions:
  contents: write
jobs:
  diagnose:
    if: "contains(github.event.head_commit.message, 'diagnose FastLink migration')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HUSKY: 0
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/mediapeek-modern-stack
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Repair script formatting
        run: pnpm exec oxfmt scripts/check-workflows.mjs
      - name: Run complete static checks
        continue-on-error: true
        run: pnpm check
      - name: Run complete unit tests
        continue-on-error: true
        run: pnpm test
      - name: Build both Workers
        continue-on-error: true
        run: pnpm build
      - name: Save formatted source only
        run: |
          set -euo pipefail
          git add -A -- scripts/check-workflows.mjs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format workflow verification script"
          git push origin HEAD:migration/mediapeek-modern-stack
