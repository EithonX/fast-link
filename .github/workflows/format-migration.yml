name: Format FastLink migration
on:
  push:
    branches:
      - migration/mediapeek-modern-stack
permissions:
  contents: write
jobs:
  format:
    if: "contains(github.event.head_commit.message, 'format FastLink migration now')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migration/mediapeek-modern-stack
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Generate new TanStack routes and format affected source
        run: |
          set -euo pipefail
          pnpm --filter mediapeek generate-routes
          pnpm exec oxfmt \
            apps/mediapeek/app/components/header.tsx \
            apps/mediapeek/app/components/footer.tsx \
            apps/mediapeek/app/routes/index.tsx \
            apps/mediapeek/app/routes/__root.tsx \
            apps/mediapeek/app/routes/fastlink.tsx \
            'apps/mediapeek/app/routes/view/$encoded/$filename.tsx' \
            apps/mediapeek/app/features/fastlink/use-history.ts \
            apps/mediapeek/app/features/analyze/media-form.tsx \
            apps/mediapeek/app/services/fastlink.server.ts \
            apps/mediapeek/app/services/fastlink.server.test.ts \
            apps/mediapeek/app/server.ts \
            packages/shared/src/fastlink.ts \
            packages/shared/src/fastlink.test.ts \
            packages/shared/package.json \
            README.md
      - name: Commit generated source without changing workflow files
        run: |
          set -euo pipefail
          git add -A -- . ':!.github'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source formatting changes."
            exit 0
          fi
          git commit -m "chore: format and regenerate FastLink migration routes"
          git push origin HEAD:migration/mediapeek-modern-stack
