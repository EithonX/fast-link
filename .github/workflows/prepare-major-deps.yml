name: Prepare major dependency refresh
on:
  push:
    branches:
      - maintenance/major-toolchain-and-motion
permissions:
  contents: write
jobs:
  prepare:
    if: "github.event.head_commit.message == 'ci: prepare major dependency refresh'"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: maintenance/major-toolchain-and-motion
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Resolve major compiler linter and animation upgrades from npm
        run: |
          set -euo pipefail
          # Re-resolve peers with the compatible maintained React lint package.
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls eslint @eslint/js typescript motion
          npm run lint
          npm run typecheck
          npx vitest run
          npm run build
      - name: Commit only dependency manifests on passing checks
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): upgrade ESLint TypeScript and Motion major versions"
          git push origin HEAD:maintenance/major-toolchain-and-motion
