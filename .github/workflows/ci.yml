name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, types and static analysis
        run: pnpm check

      - name: Run unit tests
        run: pnpm test

      - name: Build both Workers
        run: pnpm build

      - name: Dry-run analyzer Worker deployment
        working-directory: apps/mediapeek-analyzer
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc

      - name: Dry-run web Worker deployment
        working-directory: apps/mediapeek
        run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.json
